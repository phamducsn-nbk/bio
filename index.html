<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioToolkit – Học liệu KHTN &amp; Sinh học</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f8f6;--card:#fff;--tx:#12302b;--mut:#5d7a74;--pri:#08665b;--pri2:#e0f1ed;--bd:#d3e4df;--acc:#f5a524;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b19;--card:#162825;--tx:#e6f3f0;--mut:#93b0aa;--pri:#3cc2ae;--pri2:#1d3834;--bd:#294541;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b19;--card:#162825;--tx:#e6f3f0;--mut:#93b0aa;--pri:#3cc2ae;--pri2:#1d3834;--bd:#294541;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#06201c}}
header h1{margin:0;font-size:20px}header small{opacity:.85;display:block;font-size:13px}.sp{flex:1}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button,.tabs button{border:0;background:none;color:var(--mut);padding:9px 16px;border-radius:10px;font:700 15px inherit;font-family:inherit;white-space:nowrap;cursor:pointer}
nav button.on,.tabs button.on{background:var(--pri2);color:var(--pri)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.lay{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:780px){.lay{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px}.s{margin:0 0 10px;color:var(--mut);font-size:14px}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 16px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06201c}}
.btn.g{background:var(--pri2);color:var(--pri)}.btn.w{background:var(--acc);color:#2b1c00}.sm{padding:4px 10px;font-size:13px}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}
textarea{min-height:220px;font:13px ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap}
.li{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer}
.li.on{background:var(--pri2);color:var(--pri);font-weight:700}.li:hover{background:var(--pri2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:900px){.two{grid-template-columns:1fr}}
.two .card{margin:0}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);word-break:break-word}
.it a{color:var(--pri);font-weight:600}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mb{background:var(--card);border-radius:16px;padding:18px;max-width:94vw;max-height:92vh;overflow:auto;min-width:min(520px,90vw)}
select{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}
.ts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;cursor:pointer;color:#2b1c00;background:linear-gradient(135deg,#ffcf4a,#ff8a3d);padding:14px 20px;border-radius:18px;font:800 18px inherit;font-family:inherit;text-align:left;box-shadow:0 8px 24px rgba(255,140,60,.5);animation:pl 2.4s infinite}
.ts small{display:block;font:600 12px inherit;opacity:.8}
@keyframes pl{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.ts{animation:none}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2)}.opt.ok{border-color:#2bb673;background:rgba(43,182,115,.2)}.opt.no{border-color:#e5484d;background:rgba(229,72,77,.18)}
.bar{height:8px;background:var(--pri2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:100%}
.qr{background:#fff;padding:10px;display:inline-block;border-radius:10px}.qr svg{display:block;width:220px;height:220px}
</style>
</head>
<body>
<header>
  <div style="font-size:30px">🧬</div>
  <div><h1>BioToolkit</h1><small>Học liệu KHTN &amp; Sinh học THPT</small></div>
  <div class="sp"></div>
  <button class="btn g" id="bk">💾 Sao lưu</button>
  <button class="btn w" id="tm"></button>
  <button class="btn g" id="theme">🌓</button>
</header>
<nav id="gr"></nav>
<div class="lay"><aside id="ls"></aside><section id="mn"></section></div>
<button class="ts" id="ts">⚡ THỬ SỨC<small>Chọn chủ đề · chơi ngay · QR chia sẻ</small></button>
<div class="mdl" id="md"><div class="mb"><div style="text-align:right"><button class="btn g sm" id="mx">✕ Đóng</button></div><div id="mc"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const G=['KHTN 6','KHTN 7','KHTN 8','KHTN 9','SINH 10','SINH 11','SINH 12'];
const S=[['sgk','📖 Sách giáo khoa'],['tt','📝 Tóm tắt kiến thức'],['on','🧠 Ôn tập – củng cố'],['tn','🔬 Thí nghiệm – thực hành']];
let D=store.get('bio_data',{}),U=store.get('bio_ui',{g:0,s:'sgk',l:{},t:false}),arm='';
const save=()=>{store.set('bio_data',D);store.set('bio_ui',U)};

/* IndexedDB cho file */
const idb=new Promise(res=>{try{const r=indexedDB.open('bio',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const dbop=async(m,fn)=>{const d=await idb;if(!d)return null;return new Promise(ok=>{try{const tx=d.transaction('f',m),rq=fn(tx.objectStore('f'));tx.oncomplete=()=>ok(rq&&rq.result);tx.onerror=()=>ok(null)}catch(e){ok(null)}})};

const ico=(t,n)=>t.startsWith('image/')?'🖼️':t.startsWith('video/')?'🎬':t.startsWith('audio/')?'🎵':t.includes('pdf')?'📕':/\.docx?$/i.test(n)?'📘':/\.xlsx?$/i.test(n)?'📗':/\.pptx?$/i.test(n)?'📙':'📄';
const size=z=>z>1048576?(z/1048576).toFixed(1)+' MB':Math.ceil(z/1024)+' KB';
function cur(){const L=D[G[U.g]]||(D[G[U.g]]=[]);const les=L.find(x=>x.id===U.l[U.g])||L[0];return{L,les}}
const secOf=(les,k)=>les.s[k]||(les.s[k]={f:[],l:[]});
function twice(b,key){if(arm===key){arm='';return true}arm=key;b.textContent='Bấm lại để xóa';setTimeout(()=>{arm=''},3000);return false}
function modal(h){$('mc').innerHTML=h;$('md').style.display='flex'}
$('mx').onclick=()=>{$('md').style.display='none';$('mc').innerHTML=''};

function render(){
 const T=U.t,{L,les}=cur();
 $('gr').innerHTML=G.map((g,i)=>`<button data-a="g" data-i="${i}" class="${i===U.g?'on':''}">${g}</button>`).join('');
 $('tm').textContent='✏️ Chế độ giáo viên: '+(T?'Bật':'Tắt');
 $('ls').innerHTML='<div class="card"><h2>'+G[U.g]+' – Danh sách bài</h2>'+
  (L.length?L.map(x=>`<button class="li ${les&&x.id===les.id?'on':''}" data-a="l" data-id="${x.id}">${esc(x.n)}</button>`).join(''):'<p class="s">Chưa có bài nào.</p>')+
  (T?'<div class="row" style="margin-top:10px"><input id="nl" placeholder="Bài 1: Giới thiệu…"><button class="btn" data-a="al">+ Thêm bài</button></div>':'')+'</div>';
 if(!les){$('mn').innerHTML='<div class="card">'+(T?'Hãy thêm bài học đầu tiên ở khung bên trái.':'Lớp này chưa có bài học. Bật “Chế độ giáo viên” để thêm bài.')+'</div>';return}
 const k=U.s,sc=secOf(les,k);
 $('mn').innerHTML=`<div class="card">${T?`<input id="lt" value="${esc(les.n)}" style="font-size:20px;font-weight:700"><input id="lc" value="${esc(les.c||'')}" placeholder="Thuộc chương (ví dụ: Chương 1 – Di truyền)" style="margin-top:8px"><p class="s" style="margin:10px 0 4px">🧠 Câu hỏi cho THỬ SỨC – mỗi dòng một câu: Câu hỏi|Đáp án A|Đáp án B|Đáp án C|Đáp án D|Đáp án đúng (A–D). Hiện có ${parseQ(les.qt).length} câu hợp lệ.</p><textarea id="lq" placeholder="Bào quan nào thực hiện quang hợp?|Ti thể|Lục lạp|Ribosome|Golgi|B">${esc(les.qt||'')}</textarea><button class="btn g sm" data-a="dl" style="margin-top:8px">🗑️ Xóa bài này</button>`:`<h2 style="font-size:22px">${esc(les.n)}</h2>`}</div>
 <div class="tabs">${S.map(([a,b])=>`<button data-a="s" data-k="${a}" class="${a===k?'on':''}">${b}</button>`).join('')}</div>
 <div class="two">
 <div class="card"><h2>📁 File</h2><p class="s">Ảnh, video, PDF, Word, Excel, PowerPoint…</p>${T?'<input type="file" id="fi" multiple style="margin-bottom:8px">':''}
  ${sc.f.length?sc.f.map(f=>`<div class="it"><span>${ico(f.t,f.n)} ${esc(f.n)} <small style="color:var(--mut)">${size(f.z)}</small></span><span style="white-space:nowrap"><button class="btn g sm" data-a="vf" data-id="${f.id}">Xem</button>${T?` <button class="btn g sm" data-a="df" data-id="${f.id}">🗑️</button>`:''}</span></div>`).join(''):'<p class="s">Chưa có file.</p>'}</div>
 <div class="card"><h2>🔗 Link</h2><p class="s">YouTube, Google Drive, website…</p>${T?'<input id="lk" placeholder="Tiêu đề link"><input id="lu" placeholder="https://…" style="margin:6px 0"><button class="btn" data-a="al2">+ Thêm link</button>':''}
  ${sc.l.length?sc.l.map(x=>`<div class="it"><a href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(x.t||x.u)}</a>${T?`<button class="btn g sm" data-a="dk" data-id="${x.id}">🗑️</button>`:''}</div>`).join(''):'<p class="s">Chưa có link.</p>'}</div>
 </div>`}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,{L,les}=cur(),sc=les&&secOf(les,U.s);
 if(a==='g')U.g=+b.dataset.i;
 else if(a==='l')U.l[U.g]=b.dataset.id;
 else if(a==='s')U.s=b.dataset.k;
 else if(a==='al'){const n=$('nl').value.trim();if(!n)return;const x={id:uid(),n,s:{}};L.push(x);U.l[U.g]=x.id}
 else if(a==='dl'){if(!twice(b,'dl'))return;Object.values(les.s).forEach(s=>s.f.forEach(f=>dbop('readwrite',o=>o.delete(f.id))));L.splice(L.indexOf(les),1)}
 else if(a==='al2'){let u=$('lu').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u)}catch(x){return}sc.l.push({id:uid(),t:$('lk').value.trim(),u})}
 else if(a==='dk'){sc.l=sc.l.filter(x=>x.id!==b.dataset.id)}
 else if(a==='df'){if(!twice(b,b.dataset.id))return;dbop('readwrite',o=>o.delete(b.dataset.id));sc.f=sc.f.filter(f=>f.id!==b.dataset.id)}
 else if(a==='vf'){const f=sc.f.find(x=>x.id===b.dataset.id),bl=await dbop('readonly',o=>o.get(f.id));
  if(!bl){modal('<p>Không tìm thấy file này trên thiết bị. File được lưu trong trình duyệt của máy đã tải lên; để chia sẻ cho người khác hãy dùng thẻ Link.</p>');return}
  const u=URL.createObjectURL(bl),t=f.t||'';let h='<h3 style="margin-top:0">'+esc(f.n)+'</h3>';
  if(t.startsWith('image/'))h+=`<img src="${u}" style="max-width:100%">`;
  else if(t.startsWith('video/'))h+=`<video src="${u}" controls style="max-width:100%"></video>`;
  else if(t.startsWith('audio/'))h+=`<audio src="${u}" controls></audio>`;
  else if(t.includes('pdf'))h+=`<iframe src="${u}" style="width:80vw;height:65vh;border:0"></iframe>`;
  modal(h+`<p><a class="btn" href="${u}" download="${esc(f.n)}">⬇️ Tải về</a></p>`);return}
 save();render()});

document.addEventListener('change',async e=>{const t=e.target,{les}=cur();if(!les)return;
 if(t.id==='lt'){les.n=t.value.trim()||les.n;save();render()}
 if(t.id==='lc'){les.c=t.value.trim();save();render()}
 if(t.id==='lq'){les.qt=t.value;save();render()}
 if(t.id==='fi'){const sc=secOf(les,U.s);for(const f of t.files){const id=uid();await dbop('readwrite',o=>o.put(f,id));sc.f.push({id,n:f.name,t:f.type||'',z:f.size})}save();render()}});

$('tm').onclick=()=>{U.t=!U.t;save();render()};
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
$('bk').onclick=()=>{modal(`<h3 style="margin-top:0">💾 Sao lưu / khôi phục danh sách bài, link, tên file</h3>
 <p class="s">Sao chép nội dung dưới đây để lưu lại, hoặc dán dữ liệu cũ vào rồi bấm Nhập. Lưu thành <b>data.json</b> trong repo GitHub thì mọi máy mở trang lần đầu sẽ tự nạp. Lưu ý: bản sao lưu không chứa nội dung file đã tải lên.</p>
 <textarea id="bj"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="bi">Nhập dữ liệu</button><span id="bm" class="s"></span></div>`);
 $('bj').value=JSON.stringify(D,null,1);
 $('bi').onclick=()=>{try{const v=JSON.parse($('bj').value);if(!v||typeof v!=='object'||Array.isArray(v))throw 0;D=v;save();render();$('bm').textContent='Đã nhập xong.'}catch(x){$('bm').textContent='Dữ liệu không hợp lệ.'}}};

/* ===== THỬ SỨC ===== */
const LET='ABCDEFGH',MODES=[['quiz','🎯 Trắc nghiệm','Chọn đáp án đúng, mỗi câu 10 điểm'],['time','⏱️ Đua tốc độ','15 giây mỗi câu, trả lời càng nhanh càng nhiều điểm'],['card','🃏 Thẻ ghi nhớ','Lật thẻ xem đáp án, tự đánh giá đã nhớ hay chưa']],MN=Object.fromEntries(MODES.map(m=>[m[0],m[1]]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let TS={g:U.g,topic:'all',mode:'quiz',num:10,nm:''},P=null,PD=null,tm=null;
function parseQ(t){return (t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());if(p.length<4)return null;const k=LET.indexOf(p[p.length-1].toUpperCase()),o=p.slice(1,-1);return k<0||k>=o.length?null:[p[0],o,k]}).filter(Boolean)}
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));try{const r=await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'z'+b64(new Uint8Array(r))}catch(e){return 'p'+b64(b)}}
async function dec(s){const u=unb(s.slice(1));let t;if(s[0]==='z'){t=new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else t=new TextDecoder().decode(u);const d=JSON.parse(t);if(!d||!Array.isArray(d.q)||!d.q.length)throw 0;return d}
const loadQR=()=>new Promise(r=>{if(window.qrcode)return r();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=r;s.onerror=r;document.head.append(s)});
function tsQs(){const L=(D[G[TS.g]]||[]).filter(x=>parseQ(x.qt).length),t=TS.topic;return (t==='all'?L:t[0]==='l'?L.filter(x=>x.id===t.slice(2)):L.filter(x=>(x.c||'')===t.slice(2))).flatMap(x=>parseQ(x.qt))}
const deck=()=>{let q=shuffle(tsQs());return TS.num?q.slice(0,TS.num):q};
function lbl(){const t=TS.topic,L=D[G[TS.g]]||[];return t==='all'?G[TS.g]+' – tất cả bài':t[0]==='l'?(L.find(x=>x.id===t.slice(2))||{}).n:t.slice(2)}
function tsOpen(){const L=(D[G[TS.g]]||[]).filter(x=>parseQ(x.qt).length),ch=[...new Set(L.map(x=>x.c).filter(Boolean))];
 if(TS.topic!=='all'&&!L.some(x=>'l:'+x.id===TS.topic)&&!ch.some(c=>'c:'+c===TS.topic))TS.topic='all';
 const n=tsQs().length,sel=(v,l)=>`<option value="${esc(v)}" ${TS.topic===v?'selected':''}>${esc(l)}</option>`;
 modal(`<h2 style="margin:0 0 4px">⚡ THỬ SỨC</h2><p class="s">Chọn chủ đề và hình thức, rồi chơi ngay hoặc tạo link / QR cho cả lớp.</p>
<b>1. Chủ đề</b><div class="row" style="margin:6px 0 14px"><select id="tg" style="flex:1">${G.map((g,i)=>`<option value="${i}" ${i===TS.g?'selected':''}>${g}</option>`).join('')}</select>
<select id="tp" style="flex:2"><option value="all">Tất cả bài có câu hỏi</option>${ch.length?'<optgroup label="Theo chương">'+ch.map(c=>sel('c:'+c,c)).join('')+'</optgroup>':''}${L.length?'<optgroup label="Theo bài">'+L.map(x=>sel('l:'+x.id,x.n)).join('')+'</optgroup>':''}</select></div>
<b>2. Hình thức</b><div style="margin:6px 0 14px">${MODES.map(([k,t,d])=>`<button class="opt ${TS.mode===k?'on':''}" data-ts="md" data-v="${k}"><b>${t}</b><br><small>${d}</small></button>`).join('')}</div>
<b>3. Số câu</b> <select id="tn" style="width:auto">${[5,10,15,20,0].map(x=>`<option value="${x}" ${TS.num===x?'selected':''}>${x||'Tất cả'}</option>`).join('')}</select> <span class="s">(chủ đề có ${n} câu)</span>
<input id="tnm" placeholder="Tên của bạn (không bắt buộc)" value="${esc(TS.nm)}" style="margin-top:10px">
<div class="row" style="margin-top:14px">${n?'<button class="btn" data-ts="play">▶ Chơi ngay</button><button class="btn w" data-ts="share">🔗 Tạo link, QR &amp; mã cho lớp</button>':'<span class="s">Chủ đề này chưa có câu hỏi. Giáo viên thêm câu hỏi trong Chế độ giáo viên.</span>'}</div>
<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><b>Có mã hoặc link từ giáo viên?</b><div class="row" style="margin-top:6px"><input id="tcd" placeholder="Dán link hoặc mã tham gia" style="flex:1"><button class="btn g" data-ts="code">Vào chơi</button></div>`)}
async function tsShare(){const d={t:lbl(),m:TS.mode,q:deck()},c=await enc(d),url=location.href.split('#')[0]+'#play='+c;await loadQR();let qr;
 try{const x=qrcode(0,'L');x.addData(url);x.make();qr='<div class="qr">'+x.createSvgTag(4,0)+'</div>'}catch(e){qr='<p class="s">Link quá dài để tạo QR. Hãy chọn ít câu hơn.</p>'}
 modal(`<h3 style="margin:0">🔗 Chia sẻ “${esc(d.t)}”</h3><p class="s">${MN[d.m]} · ${d.q.length} câu. Học sinh quét QR hoặc mở link là chơi được, không cần tài khoản.</p><div style="text-align:center">${qr}</div>
<p><b>Link</b></p><div class="row"><input id="sl" readonly value="${esc(url)}" style="flex:1"><button class="btn g" data-ts="cp" data-v="sl">Chép</button></div>
<p><b>Mã tham gia</b> <small class="s">(dán vào ô “Có mã hoặc link”)</small></p><div class="row"><input id="sc" readonly value="${esc(c)}" style="flex:1"><button class="btn g" data-ts="cp" data-v="sc">Chép</button></div>
<button class="btn g" data-ts="open" style="margin-top:12px">◀ Quay lại</button>`)}
function tsIntro(d){PD=d;modal(`<h2 style="margin:0">⚡ ${esc(d.t)}</h2><p class="s">${MN[d.m]||''} · ${d.q.length} câu</p><input id="tnm" placeholder="Nhập tên của bạn" value="${esc(TS.nm)}"><button class="btn" data-ts="go" style="margin-top:10px">▶ Bắt đầu</button>`)}
function tsStart(d){clearInterval(tm);PD=d;P={t:d.t,m:d.m,q:d.q.map(([q,o,k])=>({q,o:shuffle(o.map((t,i)=>({t,ok:i===k})))})),i:0,s:0,h:0,nm:TS.nm,lock:false};tsQ()}
function tsQ(){clearInterval(tm);if(P.i>=P.q.length)return tsEnd();P.lock=false;const c=P.q[P.i],ok=c.o.find(x=>x.ok).t;
 const head=`<div class="s">${esc(P.t)} · Câu ${P.i+1}/${P.q.length} · Điểm: ${P.s}</div><div class="bar"><i id="tb" style="width:${P.m==='time'?100:P.i/P.q.length*100}%"></i></div><div style="font-size:19px;font-weight:700;margin:14px 0">${esc(c.q)}</div>`;
 if(P.m==='card'){modal(head+`<div class="it" id="ta" style="display:none;background:var(--pri2);padding:12px;border-radius:10px">${esc(ok)}</div><div class="row" id="tr" style="margin-top:10px"><button class="btn" data-ts="flip">Lật thẻ</button></div>`);return}
 modal(head+c.o.map((x,i)=>`<button class="opt" data-ts="ans" data-v="${i}">${LET[i]}. ${esc(x.t)}</button>`).join(''));
 if(P.m==='time'){P.t0=Date.now();tm=setInterval(()=>{const r=1-(Date.now()-P.t0)/15000,bar=$('tb');if(bar)bar.style.width=Math.max(0,r*100)+'%';if(r<=0){clearInterval(tm);tsAns(-1)}},100)}}
function tsAns(i){if(P.lock)return;P.lock=true;clearInterval(tm);const c=P.q[P.i],good=i>=0&&c.o[i].ok;
 if(good){P.h++;P.s+=P.m==='time'?100+Math.max(0,Math.round((15000-(Date.now()-P.t0))/150)):10}
 document.querySelectorAll('#mc .opt').forEach((b,j)=>{if(c.o[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('no')});
 const nx=document.createElement('button');nx.className='btn';nx.dataset.ts='next';nx.textContent=P.i+1<P.q.length?'Câu tiếp ▶':'Xem kết quả';nx.style.marginTop='8px';$('mc').append(nx)}
function tsEnd(){const txt=(P.nm||'Học sinh')+' – '+P.t+': '+P.h+'/'+P.q.length+(P.m==='card'?' thẻ đã nhớ':' câu đúng, '+P.s+' điểm');
 modal(`<h2 style="margin:0">🏁 Hoàn thành!</h2><p style="font-size:20px;font-weight:700">${esc(txt)}</p><p class="s">Chép dòng kết quả này gửi cho giáo viên (hoặc chụp màn hình).</p><div class="row"><input id="sr" readonly value="${esc(txt)}" style="flex:1"><button class="btn g" data-ts="cp" data-v="sr">Chép</button></div><div class="row" style="margin-top:12px"><button class="btn" data-ts="again">🔁 Chơi lại</button><button class="btn g" data-ts="open">⚡ Chủ đề khác</button></div>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-ts]');if(!b)return;const a=b.dataset.ts,v=b.dataset.v;
 if(a==='md'){TS.mode=v;tsOpen()}
 else if(a==='open')tsOpen();
 else if(a==='play'){const q=deck();if(q.length)tsStart({t:lbl(),m:TS.mode,q})}
 else if(a==='share')tsShare();
 else if(a==='code'){let s=$('tcd').value.trim();const i=s.indexOf('#play=');if(i>=0)s=s.slice(i+6);try{tsIntro(await dec(s))}catch(x){$('tcd').value='';$('tcd').placeholder='Mã hoặc link không hợp lệ'}}
 else if(a==='go'){TS.nm=($('tnm').value||'').trim();tsStart(PD)}
 else if(a==='again')tsStart(PD);
 else if(a==='cp'){const el=$(v);el.select();try{navigator.clipboard.writeText(el.value)}catch(x){}b.textContent='✓'}
 else if(a==='ans')tsAns(+v);
 else if(a==='next'){P.i++;tsQ()}
 else if(a==='flip'){$('ta').style.display='block';$('tr').innerHTML='<button class="btn" data-ts="ck" data-v="1">✅ Đã nhớ</button><button class="btn g" data-ts="ck" data-v="0">🔁 Chưa nhớ</button>'}
 else if(a==='ck'){if(v==='1'){P.h++;P.s+=10}P.i++;tsQ()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='tg'){TS.g=+t.value;TS.topic='all';tsOpen()}else if(t.id==='tp'){TS.topic=t.value;tsOpen()}else if(t.id==='tn'){TS.num=+t.value;tsOpen()}else if(t.id==='tnm')TS.nm=t.value.trim()});
$('ts').onclick=tsOpen;
async function tsBoot(){const h=location.hash;if(h.startsWith('#play=')){try{tsIntro(await dec(h.slice(6)))}catch(e){modal('<p>Link hoặc mã không hợp lệ.</p>')}}}
(async()=>{if(!Object.keys(D).length){try{const r=await fetch('data.json');if(r.ok){const v=await r.json();if(v&&typeof v==='object'){D=v;save()}}}catch(e){}}render();tsBoot()})();
</script>
</body>
</html>
