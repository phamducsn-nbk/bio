<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HỆ THỐNG TỰ HỌC KHTN & SINH HỌC</title>
<style>
:root{--pri:#15803d;--pri2:#dcfce7;--bg:#f2f9f3;--card:#fff;--tx:#14281d;--mut:#5b6f63;--bd:#d3e5d8;--acc:#f59e0b;--bad:#dc2626;--ok:#16a34a;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.hidden{display:none!important}
h1,h2,h3{margin:0}
h2{font-size:21px;margin-bottom:12px;padding-bottom:10px;position:relative}
h2::after{content:"";position:absolute;left:0;bottom:0;width:120px;height:5px;border-radius:5px;background:linear-gradient(90deg,#16a34a 0 33%,#f59e0b 33% 66%,#ec4899 66%)}
h3{font-size:17px;margin-bottom:8px}
.muted{color:var(--mut)}
/* ---------- banner ---------- */
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#14532d,#166534 45%,#0f766e);color:#fff;padding:12px 18px;display:flex;gap:18px;align-items:center}
header .dc{position:absolute;font-size:30px;opacity:.2;pointer-events:none;user-select:none}
.d1{left:2%;top:4px}.d2{left:36%;bottom:-6px;font-size:36px}.d3{right:22%;top:2px}.d4{right:2%;bottom:-4px;font-size:38px}.d5{left:62%;top:0}
header .hi{font-size:46px;flex:none;filter:drop-shadow(0 2px 3px #0006)}
.ht{display:flex;flex-direction:column;flex:none;position:relative}
.ht h1{display:flex;justify-content:space-between;gap:.28em;white-space:nowrap;font-size:clamp(20px,2.2vw,32px);font-weight:900;letter-spacing:.3px;text-shadow:0 2px 4px #0005}
.sub{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:clamp(13px,1.35vw,19px);font-weight:900;letter-spacing:.6px;text-shadow:0 1px 2px #0006;white-space:nowrap}
.w1{color:#fde047}.w2{color:#86efac}.w3{color:#fda4af}.w4{color:#7dd3fc}
.nbkw{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.nbk{display:inline-block;color:#fde047;font-weight:900;font-size:clamp(16px,1.7vw,26px);text-decoration:none;background:#052e2b;border:2px solid #fde047;border-radius:999px;padding:5px 20px;box-shadow:0 3px 0 #ca8a04,0 6px 12px #0005;white-space:nowrap}
.nbk:hover{background:#064e3b}
.stats{font-size:13px;background:#0003;border-radius:999px;padding:3px 14px;white-space:nowrap}
.hb{display:flex;gap:8px;align-items:center;flex:none;position:relative}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:15px}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:#ffffff26;border:1px solid #fff6}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.warn{background:var(--acc);color:#3b2a00}.btn.red{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.blue{background:#0284c7}
/* ---------- thanh lớp ---------- */
nav{background:#fff;border-bottom:3px solid var(--pri);display:flex;gap:6px;padding:8px 14px;overflow-x:auto;position:sticky;top:0;z-index:20;scrollbar-width:thin}
nav button{flex:none;border:2px solid var(--bd);background:#fff;border-radius:12px;padding:8px 18px;font-weight:800;cursor:pointer;font-size:15px;color:var(--tx)}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
nav button.ad{border-color:#f59e0b;background:#fffbeb}nav button.ad.on{background:#d97706;border-color:#d97706;color:#fff}
nav .sp{flex:1}
#abar{background:#fff7ed;border-bottom:2px solid #fdba74;padding:6px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0000000a}
.lay{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
.lay>*{min-width:0}
#side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;padding:10px}
.side-h{font-weight:900;color:var(--pri);padding:4px 8px 8px;font-size:17px}
.chh{display:block;width:100%;text-align:left;border:0;background:#ecfdf3;color:#14532d;font-weight:800;padding:9px 10px;border-radius:10px;margin-top:6px;cursor:pointer;line-height:1.3}
.chh .ar{display:inline-block;transition:.15s;margin-right:6px}.chh.open .ar{transform:rotate(90deg)}
.chl{display:none;padding:2px 0 2px 8px}.chl.open{display:block}
.li{display:flex;width:100%;gap:8px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:9px;cursor:pointer;line-height:1.3;font-size:15px}
.li:hover{background:#f0fdf4}.li.on{background:var(--pri);color:#fff}
.li .no{flex:none;min-width:24px;height:24px;border-radius:50%;background:#bbf7d0;color:#14532d;font-weight:800;font-size:12px;display:grid;place-items:center}
.li.on .no{background:#fff;color:var(--pri)}
.li i{margin-left:auto;font-style:normal;font-size:11px;opacity:.7;white-space:nowrap}
.crumb{font-size:14px;color:var(--mut);margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:13.5px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
/* ---------- trang chủ ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#dcfce7,#fef9c3 60%,#fce7f3);padding:24px 20px 26px;margin-bottom:16px;border:1px solid var(--bd)}
.hero .fl{position:absolute;font-size:44px;opacity:.55;pointer-events:none}
.hero h2{font-size:25px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;position:relative}
.gc{border:0;border-radius:18px;padding:18px 12px;color:#fff;cursor:pointer;font-weight:900;font-size:22px;text-align:center;box-shadow:0 4px 0 #0003;transition:.15s}
.gc:hover{transform:translateY(-3px)}.gc small{display:block;font-size:12.5px;font-weight:600;opacity:.92;margin-top:4px}
.gc span{display:block;font-size:34px}
/* ---------- tài liệu ---------- */
.mat{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px;background:#fcfffc}
.mat h4{margin:0 0 8px;font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mat img{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.mat iframe,.mat video{width:100%;border:0;border-radius:8px;background:#000}
.mat .ifr{aspect-ratio:16/9;height:auto}.mat .pdf{height:75vh}
.mat .note{white-space:pre-wrap;line-height:1.7}
.empty{text-align:center;padding:30px 10px;color:var(--mut);border:2px dashed var(--bd);border-radius:14px}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px;border:2px dashed #fdba74;border-radius:12px;background:#fffbeb}
/* ---------- câu hỏi ---------- */
.qbox{border:1px solid var(--bd);border-radius:14px;padding:14px;background:#fff}
.qn{font-weight:800;color:var(--pri);margin-bottom:4px}
.qt{font-size:17px;font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:2px solid var(--bd);background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font-size:16px;align-items:flex-start}
.opt:hover{border-color:var(--pri)}.opt.sel{border-color:#0284c7;background:#e0f2fe}.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.no{border-color:var(--bad);background:#fee2e2}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:#e5efe8;display:grid;place-items:center;font-size:13px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.55}
.fb.good{background:#dcfce7;border:1px solid #86efac}.fb.bad{background:#fee2e2;border:1px solid #fca5a5}.fb.hint{background:#fef9c3;border:1px solid #fde047}.fb.info{background:#e0f2fe;border:1px solid #7dd3fc}
table.tf{width:100%;border-collapse:collapse;margin:8px 0}
table.tf td,table.tf th{border:1px solid var(--bd);padding:7px 9px;text-align:left}
table.tf th{background:#ecfdf3}table.tf td.c{text-align:center;width:70px}
table.tf tr.ok td:first-child{background:#dcfce7}table.tf tr.no td:first-child{background:#fee2e2}
.prog{height:10px;border-radius:6px;background:#e5efe8;overflow:hidden;margin:6px 0 12px}.prog>i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#84cc16)}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:34px;height:34px;border-radius:8px;border:2px solid var(--pri);background:#fff;color:var(--pri);font-weight:900;cursor:pointer;font-size:18px}
.stepper input{width:64px;text-align:center;padding:6px;border:2px solid var(--bd);border-radius:8px}
#clock{position:sticky;top:60px;z-index:5;background:#fff7ed;border:2px solid #fdba74;border-radius:12px;padding:8px 12px;font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qd{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:2px solid var(--bd);cursor:pointer;font-size:13px;font-weight:800;background:#fff}.qd.done{background:var(--pri);color:#fff;border-color:var(--pri)}
.score{font-size:46px;font-weight:900;color:var(--pri)}
/* ---------- AI ---------- */
.ai{border:2px solid #86efac;background:linear-gradient(#f0fdf4,#fff);border-radius:14px;padding:12px;margin-top:14px}
.ai .row{display:flex;gap:8px}.ai input{flex:1;min-width:0;padding:10px;border:2px solid var(--bd);border-radius:10px}
.aq{background:var(--pri2);padding:8px 12px;border-radius:12px 12px 12px 4px;margin:10px 0 4px;font-weight:600;word-break:break-word}
.aa{background:#fff;border:1px solid var(--bd);padding:8px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.55;word-break:break-word}
#ail{max-height:55vh;overflow-y:auto}
/* ---------- quản trị ---------- */
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{border:2px solid var(--bd);border-radius:9px;padding:8px 10px;background:#fff;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
.fg{margin-bottom:10px}.fg label{display:block;font-weight:700;font-size:14px;margin-bottom:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--pri);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:700;cursor:pointer}.seg button.on{background:var(--pri);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#ecfdf3;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:center}
.pill{display:inline-block;background:#e5efe8;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-right:4px}
.pill.l1{background:#dcfce7;color:#166534}.pill.l2{background:#fef9c3;color:#854d0e}.pill.l3{background:#fee2e2;color:#991b1b}
.qi{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.qi .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.errl{color:#b45309;font-size:13px}
.ok2{color:var(--ok);font-weight:700}.bad2{color:var(--bad);font-weight:700}
.step{display:flex;gap:10px;margin:10px 0}.stn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800}
.mx td input{width:56px;padding:4px;text-align:center}
.mx td.av{font-size:12px;color:var(--mut);text-align:center}
/* ---------- modal, toast ---------- */
.mdl{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mb{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto}
.mb.wide{max-width:900px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14532d;color:#fff;padding:10px 18px;border-radius:12px;z-index:200;box-shadow:0 4px 14px #0006;max-width:92vw;text-align:center}
#toast.err{background:#b91c1c}
#gate{position:fixed;inset:0;z-index:90;background:linear-gradient(135deg,#14532d,#0f766e);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#gate .gb{background:#fff;border-radius:24px;padding:26px 24px;max-width:460px;width:100%;text-align:center;box-shadow:0 10px 40px #0007}
#gate h1{font-size:23px;color:var(--pri);line-height:1.25;margin:6px 0 4px}
#gate input{width:100%;padding:12px;margin:5px 0;border:2px solid var(--bd);border-radius:12px;font-size:17px}
.ft{text-align:center;color:var(--mut);font-size:13px;padding:16px}
/* ---------- bản in đề ---------- */
.pv{position:fixed;inset:0;background:#e5e7eb;z-index:150;overflow:auto}
.pvbar{position:sticky;top:0;background:#14532d;color:#fff;padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
.paper{background:#fff;width:210mm;max-width:100%;margin:14px auto;padding:11mm 12mm;box-shadow:0 2px 12px #0004;font-family:"Times New Roman",Times,serif;font-size:12.5pt;line-height:1.32;color:#000}
.paper *{box-sizing:border-box}
.ph{width:100%;border-collapse:collapse;margin-bottom:6px}
.ph td{vertical-align:top;padding:0 4px;font-size:11.5pt}
.ph .ctr{text-align:center}
.ph .code{display:inline-block;border:2px solid #000;padding:2px 12px;font-weight:700;font-size:13pt;margin-top:3px}
.pt{font-weight:700;font-size:15pt;text-align:center;margin:2px 0}
.pinfo{display:flex;justify-content:space-between;border-top:1.5px solid #000;border-bottom:1.5px solid #000;padding:3px 0;margin:5px 0 8px;font-size:11.5pt}
.psec{break-after:avoid;background:#e5e7eb;border-left:5px solid #000;padding:2px 8px;margin:8px 0 5px;font-weight:700;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cols{column-count:2;column-gap:9mm;column-rule:1px solid #bbb}
.pq{break-inside:avoid;margin-bottom:5px;}
.pq b.n{font-weight:700}
.po{display:grid;gap:0 8px;margin-left:2px}
.po.c4{grid-template-columns:repeat(4,1fr)}.po.c2{grid-template-columns:repeat(2,1fr)}.po.c1{grid-template-columns:1fr}
.ptf{margin-left:14px}
.pend{text-align:center;font-weight:700;margin-top:8px;font-style:italic}
.key{page-break-before:always}
.key table{border-collapse:collapse;margin:4px 0 10px}.key td,.key th{border:1px solid #000;padding:2px 7px;text-align:center;font-size:11.5pt}
.key .kt{font-weight:700;margin:6px 0 2px}
.pb{page-break-before:always}
@media print{
 @page{size:A4;margin:9mm}
 body.printing>*:not(#pv){display:none!important}
 body.printing{background:#fff}
 .pv{position:static;background:#fff;overflow:visible}.pvbar{display:none!important}
 .paper{box-shadow:none;margin:0;width:auto;padding:0}
}
/* ---------- điện thoại ---------- */
html.m body{overflow-x:hidden}
html.m header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 12px}
html.m header .hi{display:none}
html.m header .dc:nth-of-type(n+4){display:none}
html.m .ht{display:contents}
html.m .ht h1{grid-column:1;grid-row:1;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:0 .3em;min-width:0;white-space:normal;font-size:15px;line-height:1.25}
html.m .sub{grid-column:1/-1;grid-row:2;min-width:0;gap:4px;font-size:2.6vw;margin:2px 0 0}
html.m .hb{grid-column:2;grid-row:1}
html.m .hb .btn{padding:6px 9px;font-size:12px;min-height:34px}html.m .hb .vl{display:none}
html.m .nbkw{grid-column:1/-1;grid-row:3;flex:none;margin:2px 0 0}
html.m .nbk{font-size:17px;padding:4px 14px}
html.m .stats{font-size:11.5px;padding:3px 10px}
html.m nav{padding:6px 8px;gap:4px;scrollbar-width:none}html.m nav button{padding:8px 12px;font-size:14px}
html.m main{padding:10px}
html.m .lay{display:block}
html.m #side{position:static;max-height:none}
html.m #side .body{display:none}html.m #side.show .body{display:block;max-height:55vh;overflow-y:auto}
html.m .card{padding:12px}
html.m .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}html.m .tabs button{flex:none}
html.m input,html.m textarea,html.m select{font-size:16px}
html.m .btn{min-height:40px}
html.m .mdl{align-items:flex-end;padding:0}html.m .mb{border-radius:18px 18px 0 0;max-height:92dvh}
html.m .gcards{grid-template-columns:repeat(2,1fr)}
html.m .gc{font-size:19px;padding:14px 8px}
html.m .paper{padding:8mm}
html.m table.t{display:block;overflow-x:auto}
html.fm body{max-width:480px;margin:0 auto;box-shadow:0 0 40px #0004}
#sidebtn{display:none;width:100%}html.m #sidebtn{display:block}

html:not(.m) nav{flex-wrap:wrap}

.dg{display:inline-block;font-style:normal;background:#052e2b;color:#fde047;border:1px solid #fde04788;border-radius:4px;padding:0 4px;margin:0 1px;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace;min-width:1.05em;text-align:center}

canvas.zi{display:block;max-width:100%;border-radius:8px;cursor:zoom-in;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#zoomov{position:fixed;inset:0;z-index:300;background:#111;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#zoomov canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.zbar{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.zbar button{width:48px;height:48px;border-radius:50%;border:0;background:#ffffffd9;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0008}
.zhint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:13px;opacity:.75;pointer-events:none;padding:0 12px}
@media print{body:not(.printing) canvas.zi,body:not(.printing) #zoomov{display:none!important}}

.expc{display:block;position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--pri);cursor:pointer;text-decoration:none}.expc img{display:block;width:100%;height:auto}.expgo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000b);color:#fff;font-weight:800;padding:26px 12px 10px;text-align:center}.expc:hover .expgo{background:linear-gradient(transparent,#15803dee)}

.lnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.lnav.bot{margin-top:18px;padding-top:12px;border-top:1px dashed #cfe3d6}.lnav .btn{font-size:14px;padding:8px 12px}.lnav .btn[disabled]{opacity:.4;cursor:default}.lnav .muted{font-size:13px;text-align:center}@media(max-width:560px){.lnav .btn{font-size:12px;padding:8px 8px}}

</style>
</head>
<body>
<header id="hd">
 <div class="dc d1">🌿</div><div class="dc d2">🦋</div><div class="dc d3">🍃</div><div class="dc d4">🐢</div><div class="dc d5">🌱</div>
 <div class="hi">🧬</div>
 <div class="ht">
  <h1><span>HỆ</span><span>THỐNG</span><span>TỰ</span><span>HỌC</span><span>KHTN</span><span>&amp;</span><span>SINH</span><span>HỌC</span></h1>
  <div class="sub"><b class="w1">HỌC KIẾN THỨC</b><b class="w2">ÔN TẬP</b><b class="w3">VẬN DỤNG</b><b class="w4">KIỂM TRA</b></div>
 </div>
 <div class="nbkw">
  <a class="nbk" href="https://www.nbk.edu.vn" target="_blank" rel="noopener">📖 www.nbk.edu.vn</a>
  <div class="stats" id="stats">👁 Lượt truy cập: <b id="sv">—</b> · 🟢 Đang xem: <b id="so">—</b></div>
 </div>
 <div class="hb"><button id="adminBtn" class="btn g" type="button">🔐 Quản trị</button><button id="vm" class="btn g" type="button"></button></div>
</header>
<nav id="nav"></nav>

/* ---------- đăng nhập quản trị ---------- */
function sha256(msg){const P=[];for(let n=2;P.length<64;n++)if(P.every(q=>n%q))P.push(n);const fr=x=>Math.floor((x-Math.floor(x))*4294967296)>>>0,K=new Uint32Array(P.map(q=>fr(Math.cbrt(q)))),H=new Uint32Array(P.slice(0,8).map(q=>fr(Math.sqrt(q))));
 const by=new TextEncoder().encode(msg),l=by.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(by);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
 const w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h}
 return[...H].map(x=>x.toString(16).padStart(8,"0")).join("")}

async function cnt(path){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);try{const r=await fetch("https://abacus.jasoncameron.dev/"+path,{signal:ac.signal});if(!r.ok)return null;const j=await r.json();return typeof j.value==="number"?j.value:null}catch(e){return null}finally{clearTimeout(t)}}
const NS="nbk-khtn-sinh";
function odo(n){let t=String(Math.max(0,n|0)).padStart(6,"0");return t.split("").map(c=>`<i class="dg">${c}</i>`).join("")}
async function cntAlt(kind,key){/* máy đếm dự phòng khi dịch vụ chính không truy cập được */
 const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
 try{const r=await fetch(`https://api.counterapi.dev/v1/${NS}/${key}/${kind==="hit"?"up":""}`,{signal:ac.signal});if(!r.ok)return null;const j=await r.json();return typeof j.count==="number"?j.count:null}catch(e){return null}finally{clearTimeout(t)}}

let visitHit=false;

 /* mỗi lần mở trang = 1 lượt (kể cả cùng thiết bị/IP); các lần làm mới sau đó chỉ đọc số */
 let sv=await counter(visitHit?"get":"hit","visits");if(sv==null&&!visitHit)sv=await counter("hit","visits");if(sv!=null){visitHit=true;$("sv").innerHTML=odo(sv)}
 let seen=false;try{seen=ss.getItem("kh_b")===String(b)}catch(e){}
 let so=await counter(seen?"get":"hit","on"+b);try{ss.setItem("kh_b",String(b))}catch(e){}
 let pv=await counter("get","on"+(b-1));if(so!=null)$("so").textContent=Math.max(so,pv||0)}

 document.body.append(d);document.body.style.overflow="hidden";addEventListener("keydown",zKey);
 const cv=d.querySelector("canvas"),ctx=cv.getContext("2d"),img=new Image(),S={s:1,x:0,y:0},DP=Math.min(devicePixelRatio||1,2);let W=0,H=0,fit=1;

 function zoomAt(f,px,py){const ns=Math.max(.5,Math.min(10,S.s*f)),r=ns/S.s;S.x=(px-W/2)-((px-W/2)-S.x)*r;S.y=(py-H/2)-((py-H/2)-S.y)*r;S.s=ns;draw()}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function shrinkImage(dataUrl,maxDim=1600,q=.82){const img=await loadImg(dataUrl);let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const out=c.toDataURL("image/jpeg",q);c.width=c.height=0;return out}

function parseTOC(text,g){const chs=[];let cur=null,maxNo=0;const used=new Set(),old=Object.fromEntries(lessonsOf(g).map(l=>[l.no,l.id]));
 const RXC=/^\s*(chương|chuong|chủ đề|chu de|phần|phan|chuyên đề|chuyen de|unit|module)(?=[\s.:\-–)]|$)\s*([IVXLC\d]+)?\s*[.:\-–)]?\s*(.*)$/i,RXL=/^\s*(?:bài|bai)\s*(\d+)\s*[.:\-–)]?\s*(.*)$/i,RXN=/^\s*(\d{1,3})\s*[.)\-–]\s+(.+)$/;
 const clean=s=>s.replace(/\s*[.…·]{2,}\s*\d+\s*$/,"").replace(/\s{2,}\d{1,3}$/,"").replace(/\t+\d{1,3}$/,"").trim();
 for(let raw of String(text||"").replace(/\r/g,"").split("\n")){let s=clean(raw.replace(/\t/g,"  ").trim());if(!s)continue;let m;
  if(m=s.match(RXC)){if(RXL.test(s))continue;cur={id:newId(),name:s.replace(/\s+/g," "),lessons:[]};chs.push(cur);continue}
  let no=null,nm=s;if(m=s.match(RXL)){no=+m[1];nm=m[2]||("Bài "+m[1])}else if(m=s.match(RXN)){no=+m[1];nm=m[2]}
  else if(s===s.toUpperCase()&&/[A-ZÀ-Ỹ]{3}/.test(s)&&s.length>6&&!cur){cur={id:newId(),name:s,lessons:[]};chs.push(cur);continue}
  if(!cur){cur={id:newId(),name:"Nội dung chung",lessons:[]};chs.push(cur)}
  if(no==null||used.has(no))no=Math.max(maxNo,...used,0)+1;used.add(no);maxNo=Math.max(maxNo,no);
  cur.lessons.push({id:tocMode==="replace"&&old[no]?old[no]:newId(),no,name:nm.trim()})}
 return chs}

function mxFoot(){let tot=MXC.map(()=>0);Object.values(EX.mx).forEach(m=>m.forEach((v,k)=>tot[k]+=v||0));return `<td><b>Tổng số câu</b></td>${tot.map(v=>`<td class="n"><b>${v}</b></td>`).join("")}`}

function exBuild(){const picks=[];let miss=0;

 const item=(q,k)=>`<div class="qi"><div class="top"><span><b>Câu ${k+1}</b> <span class="pill">${esc(lessonShort(q.lesson))}</span>${lvPill(q)}</span><span class="row"><button class="btn sm sec" onclick="exSwap('${q.id}')">🔁 Đổi câu</button><button class="btn sm red" onclick="exDrop('${q.id}')">✖</button></span></div><div>${esc(q.question)}</div></div>`;
 return `<div class="fb info">Phần I: <b>${mc.length}</b> câu TN (mỗi câu <b>${fmtPts(Math.round(u*100)/100)}</b> đ) · Phần II: <b>${tf.length}</b> câu ĐS (mỗi câu tối đa <b>${fmtPts(Math.round(u*400)/100)}</b> đ) · Mức độ: Biết ${lv[0]} / Hiểu ${lv[1]} / Vận dụng ${lv[2]} · Tổng 10 điểm.</div>
 ${mc.length?`<b>Phần I. Trắc nghiệm</b>${mc.map(item).join("")}`:""}${tf.length?`<b>Phần II. Đúng/Sai</b>${tf.map(item).join("")}`:""}`}

const ORDER_DEP=/(cả|tất cả|các)\s*(a|b|c|d|ý|đáp án|phương án)|không có\s*(đáp án|phương án|ý)|đều\s*(đúng|sai)|ý\s*[abcd]\s*(và|,)/i;
const cl=o=>JSON.parse(JSON.stringify(o));
function permute(q){q=cl(q);if(q.type==="mc"&&!q.options.some(o=>ORDER_DEP.test(o))){const idx=shuffle(q.options.map((_,i)=>i));q.options=idx.map(i=>q.options[i]);q.answer=idx.indexOf(q.answer)}
 return q}
function okVariant(o,v){if(!v||v.type!==o.type||typeof v.question!=="string"||!v.question.trim())return false;
 if(o.type==="mc"){if(!Array.isArray(v.options)||v.options.length!==o.options.length||!v.options.every(x=>typeof x==="string"&&x.trim()))return false;if(!Number.isInteger(v.answer)||v.answer<0||v.answer>=v.options.length)return false;return new Set(v.options.map(normC)).size===v.options.length}
 if(!Array.isArray(v.items)||v.items.length!==o.items.length)return false;return v.items.every(i=>i&&typeof i.text==="string"&&i.text.trim()&&typeof i.answer==="boolean")}
async function aiVariant(list,code){const out=list.map(q=>cl(q));let nAI=0;
 for(let s=0;s<list.length;s+=6){const chunk=list.slice(s,s+6),slim=chunk.map(q=>({type:q.type,level:LV[q.level||1],question:q.question,...(q.type==="mc"?{options:q.options,answer:q.answer}:{items:q.items}),explanation:q.explanation||""}));
  try{const r=await fetch(aiUrl(),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({mode:"variant",code,grade:gName(EX.g),questions:slim})}),j=await r.json();
   if(r.ok&&Array.isArray(j.questions))chunk.forEach((o,k)=>{const v=j.questions[k];if(okVariant(o,v)){const t=out[s+k];t.question=v.question.trim();if(o.type==="mc"){t.options=v.options.map(x=>x.trim());t.answer=v.answer}else t.items=v.items.map(i=>({text:i.text.trim(),answer:i.answer}));if(v.explanation)t.explanation=String(v.explanation);t.ai=true;nAI++}})}
  catch(e){console.warn(e)}}
 return{qs:out,nAI}}
async function exGenerate(){const base=exPicksQ();if(!base.length)return;EX.busy=true;EX.codes=null;const go=$("aigo");go.disabled=true;const prog=$("aiProg"),useAI=EX.useAI&&!!aiUrl();
 const codes=[{code:String(EX.startCode),qs:base.map(q=>({...cl(q)})),orig:true}];let aiTotal=0,aiOk=0;
 for(let i=1;i<=EX.nCodes;i++){const code=String(EX.startCode+i);prog.textContent=`⏳ Đang tạo mã đề ${code} (${i}/${EX.nCodes})…`;let qs;
  if(useAI){const r=await aiVariant(base,code);qs=r.qs;aiTotal+=base.length;aiOk+=r.nAI}else qs=base.map(cl);
  qs=qs.map(permute);const mc=shuffle(qs.filter(q=>q.type==="mc")),tf=shuffle(qs.filter(q=>q.type==="tf"));codes.push({code,qs:[...mc,...tf]})}
 EX.codes=codes;EX.act=0;EX.busy=false;
 prog.textContent=useAI?(aiOk===aiTotal?`✅ AI đã viết lại ${aiOk}/${aiTotal} câu.`:`⚠ AI viết lại được ${aiOk}/${aiTotal} câu; các câu còn lại giữ nội dung gốc và chỉ đảo thứ tự.`):"✅ Đã tạo mã đề bằng cách đảo thứ tự.";
 $("codesBox").innerHTML=codesHTML();go.disabled=false}
function codesHTML(){if(!EX.codes)return"";const c=EX.codes[EX.act];
 return `<div class="fb hint" style="margin-top:10px">⚠ Câu hỏi do AI viết lại <b>cần được thầy/cô rà soát</b> (đặc biệt số liệu và đáp án) trước khi in. Câu có nhãn 🤖 là câu AI đã viết lại.</div>
 <div class="tabs">${EX.codes.map((x,i)=>`<button class="${EX.act===i?"on":""}" onclick="EX.act=${i};$('codesBox').innerHTML=codesHTML()">Mã ${x.code}${x.orig?" (gốc)":""}</button>`).join("")}</div>
 <div style="max-height:380px;overflow:auto">${c.qs.map((q,k)=>`<div class="qi"><span class="pill">${q.type==="mc"?"TN":"ĐS"}</span>${q.ai?"🤖 ":""}${esc(q.question)}<div class="muted" style="font-size:13px">${q.type==="mc"?q.options.map((o,i)=>i===q.answer?`<b style="color:#166534">✔ ${L[i]}. ${esc(o)}</b>`:`${L[i]}. ${esc(o)}`).join(" &nbsp; "):q.items.map((it,i)=>`${AB[i]}) ${esc(it.text)} → <b>${it.answer?"Đ":"S"}</b>`).join("<br>")}</div></div>`).join("")}</div>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="exPrint()">🖨 Xem bản in / Lưu PDF</button><button class="btn blue" onclick="exWord()">⬇ Tải Word (.doc)</button></div>`}
/* nếu chưa sinh mã đề thì vẫn cho in đề gốc */
function exPrintBase(){const qs=exPicksQ();if(!qs.length)return;EX.codes=[{code:String(EX.startCode),qs:qs.map(cl),orig:true}];exPrint()}

/* ---------- bản in ---------- */
function optCls(q,two){const mx=Math.max(...q.options.map(o=>o.length));return two?(mx<=16?"c2":"c1"):(mx<=18?"c4":mx<=45?"c2":"c1")}
const br=s=>esc(s).replace(/\n/g,"<br>");
function paperHTML(c,o){const qs=c.qs,mc=qs.filter(q=>q.type==="mc"),tf=qs.filter(q=>q.type==="tf"),u=exUnit(qs),dots=n=>"…".repeat(n),W=o.word;
 const head=W?`<table width="100%" style="border-collapse:collapse"><tr><td width="42%" align="center" valign="top" style="font-size:11.5pt"><b>${esc((EX.dept||"SỞ GIÁO DỤC VÀ ĐÀO TẠO "+dots(8)).toUpperCase())}</b><br><b>${esc((EX.school||"TRƯỜNG "+dots(14)).toUpperCase())}</b></td><td align="center" valign="top"><b style="font-size:14pt">${exTitle()}</b><br><b>Môn: ${gName(EX.g)}</b> – Năm học ${esc(EX.year)}<br><i>Thời gian làm bài: ${EX.time} phút</i></td><td width="16%" align="center" valign="top"><div style="border:2px solid #000;padding:2px 8px"><b>Mã đề: ${c.code}</b></div></td></tr></table>`
 :`<table class="ph"><tr><td class="ctr" style="width:40%"><b>${esc((EX.dept||"SỞ GIÁO DỤC VÀ ĐÀO TẠO "+dots(8)).toUpperCase())}</b><br><b>${esc((EX.school||"TRƯỜNG "+dots(14)).toUpperCase())}</b></td><td class="ctr"><div class="pt">${exTitle()}</div><b>Môn: ${gName(EX.g)}</b> – Năm học ${esc(EX.year)}<br><i>Thời gian làm bài: ${EX.time} phút (không kể thời gian phát đề)</i></td><td class="ctr" style="width:18%"><div class="code">Mã đề: ${c.code}</div></td></tr></table>`;
 const info=`<div ${W?'style="border-top:1.5pt solid #000;border-bottom:1.5pt solid #000;padding:3pt 0;margin:6pt 0"':'class="pinfo"'}>Họ và tên: ${dots(24)} &nbsp; Lớp: ${dots(6)} &nbsp; SBD: ${dots(6)} &nbsp; Điểm: ${dots(5)}</div>`;
 const sec=t=>W?`<p style="background:#e5e7eb;border-left:4pt solid #000;padding:2pt 6pt;margin:8pt 0 4pt"><b>${t}</b></p>`:`<div class="psec">${t}</div>`;
 const optsW=q=>{const n=optCls(q,false),cols=n==="c4"?4:n==="c2"?2:1,rows=[];for(let i=0;i<q.options.length;i+=cols)rows.push(q.options.slice(i,i+cols).map((x,j)=>`<td valign="top" width="${100/cols}%"><b>${L[i+j]}.</b> ${esc(x)}</td>`).join(""));return `<table width="100%" style="border-collapse:collapse">${rows.map(r=>`<tr>${r}</tr>`).join("")}</table>`};
 let h=head+info;
 if(mc.length){h+=sec(`PHẦN I. Câu trắc nghiệm nhiều phương án lựa chọn. <span style="font-weight:400"><i>(${fmtPts(Math.round(u*100)/100)} điểm/câu – thí sinh trả lời từ câu 1 đến câu ${mc.length}, mỗi câu chỉ chọn một phương án)</i></span>`);
  const body=mc.map((q,k)=>`<div ${W?'style="margin-bottom:4pt"':'class="pq"'}><b class="n">Câu ${k+1}.</b> ${br(q.question)}${W?optsW(q):`<div class="po ${optCls(q,o.twoCol)}">${q.options.map((x,i)=>`<div><b>${L[i]}.</b> ${esc(x)}</div>`).join("")}</div>`}</div>`).join("");
  h+=W||!o.twoCol?body:`<div class="cols">${body}</div>`}
 if(tf.length){h+=sec(`PHẦN II. Câu trắc nghiệm đúng sai. <span style="font-weight:400"><i>(Mỗi câu tối đa ${fmtPts(Math.round(u*400)/100)} điểm – trong mỗi ý a), b), c), d) thí sinh chọn đúng hoặc sai)</i></span>`);
  h+=tf.map((q,k)=>`<div ${W?'style="margin-bottom:5pt"':'class="pq"'}><b class="n">Câu ${k+1}.</b> ${br(q.question)}${q.items.map((it,i)=>`<div ${W?'style="margin-left:14pt"':'class="ptf"'}>${AB[i]}) ${esc(it.text)} <span ${W?'':'style="float:right"'}>&nbsp;&nbsp;&nbsp;☐ Đúng &nbsp; ☐ Sai</span></div>`).join("")}</div>`).join("")}
 h+=`<p ${W?'align="center"':'class="pend"'}><i>——— HẾT ———</i></p><p ${W?'align="center"':'class="pend"'} style="font-weight:400;font-size:11pt"><i>Thí sinh không được sử dụng tài liệu. Giám thị không giải thích gì thêm.</i></p>`;return h}
function keyHTML(codes,W){const tdS=W?'style="border:1px solid #000;padding:2px 6px;text-align:center"':"",tb=W?'style="border-collapse:collapse;margin:3pt 0 8pt"':"";
 return `<div ${W?'':'class="key"'}><p ${W?'align="center"':'class="pt"'}><b>ĐÁP ÁN – ${exTitle()} – ${gName(EX.g)}</b></p>${codes.map(c=>{const mc=c.qs.filter(q=>q.type==="mc"),tf=c.qs.filter(q=>q.type==="tf");let h=`<div class="kt"><b>Mã đề ${c.code}</b></div>`;
  if(mc.length){h+=`<div><i>Phần I</i></div>`;for(let s=0;s<mc.length;s+=15){const part=mc.slice(s,s+15);h+=`<table ${tb}><tr><td ${tdS}><b>Câu</b></td>${part.map((_,i)=>`<td ${tdS}>${s+i+1}</td>`).join("")}</tr><tr><td ${tdS}><b>Đáp án</b></td>${part.map(q=>`<td ${tdS}><b>${L[q.answer]}</b></td>`).join("")}</tr></table>`}}
  if(tf.length){h+=`<div><i>Phần II</i></div><table ${tb}><tr><td ${tdS}><b>Câu</b></td>${AB.split("").map(x=>`<td ${tdS}><b>${x})</b></td>`).join("")}</tr>${tf.map((q,k)=>`<tr><td ${tdS}>${k+1}</td>${[0,1,2,3].map(i=>`<td ${tdS}>${q.items[i]?(q.items[i].answer?"Đ":"S"):"–"}</td>`).join("")}</tr>`).join("")}</table>`}return h}).join("")}</div>`}
function exPrint(){if(!EX.codes)return exPrintBase();pvRender()}
function pvRender(){const codes=EX.codes,o={twoCol:EX.twoCol};
 $("pv").innerHTML=`<div class="pv"><div class="pvbar"><b>🖨 Bản in đề kiểm tra</b><button class="btn warn sm" onclick="pvPrint()">🖨 In / Lưu PDF</button><button class="btn blue sm" onclick="exWord()">⬇ Tải Word</button><label><input type="checkbox" ${EX.twoCol?"checked":""} onchange="EX.twoCol=this.checked;pvRender()"> Phần I chia 2 cột (tiết kiệm giấy)</label><label><input type="checkbox" ${EX.withKey?"checked":""} onchange="EX.withKey=this.checked;pvRender()"> Kèm trang đáp án</label><button class="btn g sm" style="margin-left:auto" onclick="$('pv').innerHTML=''">✖ Đóng</button></div>
 ${codes.map((c,i)=>`<div class="paper ${i?"pb":""}">${paperHTML(c,o)}</div>`).join("")}${EX.withKey?`<div class="paper pb">${keyHTML(codes,false)}</div>`:""}</div>`}
function pvPrint(){document.body.classList.add("printing");const done=()=>{document.body.classList.remove("printing");removeEventListener("afterprint",done)};addEventListener("afterprint",done);setTimeout(()=>window.print(),60)}
function exWord(){if(!EX.codes){const qs=exPicksQ();if(!qs.length)return;EX.codes=[{code:String(EX.startCode),qs:qs.map(cl),orig:true}]}
 const body=EX.codes.map((c,i)=>`<div ${i?'style="page-break-before:always"':""}>${paperHTML(c,{word:true})}</div>`).join("")+(EX.withKey?`<div style="page-break-before:always">${keyHTML(EX.codes,true)}</div>`:"");
 const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Đề kiểm tra</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page{size:21cm 29.7cm;margin:1.5cm 1.6cm}body{font-family:"Times New Roman";font-size:12pt}p{margin:2pt 0}</style></head><body>${body}</body></html>`;
 download(new Blob(["﻿",html],{type:"application/msword"}),`De-kiem-tra-${gName(EX.g).replace(" ","")}-${EX.type}.doc`);toast("✅ Đã tải đề (mở bằng Word, có thể chỉnh sửa trước khi in)")}

 if(/quantri/.test(location.hash)&&!adminOK)setTimeout(()=>askAdmin(),300);
 render();
 let skip=false;try{skip=!!sessionStorage.getItem("kh_skip")}catch(e){}
